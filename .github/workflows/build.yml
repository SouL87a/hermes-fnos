name: build

# 构建：push main / 打 tag v* / 手动都会跑（产出 Artifacts）
# Release：仅 tag v* 或手动勾选 publish_release 时才发
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build.yml"
      - "upstream.version"
      - "fnos.version"
      - "packaging/**"
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Hermes 上游 ref（tag / branch / commit），留空用 upstream.version 里钉住的值"
        required: false
        default: ""
      preset:
        description: "打包档位：留空=在线版(~4MB)；B=预置 Python+wheelhouse(~130MB，安装期少下载)"
        required: false
        default: ""
      publish_release:
        description: "验证通过后发布 GitHub Release（勾选才发）"
        type: boolean
        required: false
        default: false

env:
  # 构建机必须 Linux：包里分发的是 Linux CPython 与 Linux .so，Windows/macOS 无法执行它们完成依赖安装。
  NODE_VERSION: "26"

jobs:
  fpk:
    name: Build fnOS fpk
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + upstream ref
        id: ver
        run: |
          set -e
          # 版本优先级必须与 build.sh 完全一致，否则会出现
          # 「资产名 hermes-0.22.2-1.fpk 但 tag=v0.22.2」的错配：
          #   1) fnos.version（同上游版本重打包时递增 -1/-2，如 0.22.2-1）
          #   2) 上游 ref 推导（剥 v 前缀与 +canary，保留 -N）
          if [ -n "${{ github.event.inputs.hermes_ref }}" ]; then
            REF="${{ github.event.inputs.hermes_ref }}"
          else
            REF="$(grep -vE '^\s*#|^\s*$' upstream.version | head -n 1 | tr -d '[:space:]' || true)"
          fi
          UP_VER="$(printf '%s' "$REF" | sed -E 's/^v//; s/\+.*$//')"
          FNOS_VER="$(grep -vE '^\s*#|^\s*$' fnos.version 2>/dev/null | head -n 1 | tr -d '[:space:]' || true)"
          # fnos.version 只允许是「同一上游版本 + -N 修订」：主体必须等于上游版本。
          # 否则说明上游发了新版而 fnos.version 忘了改 → 忽略它并告警，
          # 避免把新版包错标成旧版本号（那会导致应用中心认为需要降级）。
          if [ -n "$FNOS_VER" ]; then
            BASE="${FNOS_VER%%-*}"
            if [ "$BASE" = "$UP_VER" ]; then
              VERSION="$FNOS_VER"
              echo "使用 fnos.version 指定的打包版本: $VERSION"
            else
              echo "::warning::fnos.version=$FNOS_VER 与上游 $UP_VER 不一致，已忽略（请更新或清空 fnos.version）"
              VERSION="$UP_VER"
            fi
          else
            VERSION="$UP_VER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION（跟随上游 $REF）"
          echo "钉住的上游 ref: $REF"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        run: |
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          python3 --version
          node --version
          npm --version
          "$HOME/.local/bin/uv" --version
          echo "--- glibc ---"
          ldd --version | head -1

      # 构建期现在只做：源码树快照 + 前端构建 + 打包。
      # 不再下载 CPython、不再装依赖（那些改为安装期由 PM 完成）。
      # 注意：**不设**国内镜像 —— Actions runner 在海外，直连最快。
      # 档位说明：
      #   默认（在线版）  ~4MB，安装期下载 ~900MB
      #   preset=B（预置）~130MB，安装期下载 ~60MB（源码 clone）
      #   tag 构建：A/B 两版都产出，Release 同时挂两个资产
      #   手动触发：用 preset 输入选择（留空=A，B=B）
      #
      # ⚠ preset 输入必须真正生效：早先两个 step 无条件都跑，选 B 也会连带跑 A，
      #   既浪费时间又让 B 的失败淹没在 A 的成功里（无法单独验证 B）。
      #   现在按预设决定跑哪一档：
      #     preset=B  → 只跑 B（单独验证 B 用）
      #     preset=A  → 只跑 A
      #     留空      → A + B（tag 构建/日常全量）
      #   产物名统一为 hermes-<ver>-<preset>.fpk，下游校验按预设取。
      - name: Resolve presets
        id: presets
        run: |
          set -e
          # 手动触发取输入；push/tag 事件没有 inputs，留空即全量
          IN="${{ github.event.inputs.preset }}"
          IN="$(printf '%s' "$IN" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          case "$IN" in
            B|A) DO="$IN" ;;
            "")  DO="A B" ;;
            *)   echo "::error::未知 preset：$IN（只接受 A 或 B）"; exit 1 ;;
          esac
          echo "do=$DO" >> "$GITHUB_OUTPUT"
          echo "本次构建档位：$DO"

          # 产物路径按档位拼：upload-artifact 的 if-no-files-found 是按整个
          # path 列表判定的，写死两个 glob 会让单独跑 B 时因 A 缺失而整体失败。
          ART=""
          for P in $DO; do
            if [ "$P" = "A" ]; then
              ART="${ART}packaging/fnOS/dist/hermes-*online.fpk"$'\n'
            else
              ART="${ART}packaging/fnOS/dist/hermes-*presetB.fpk"$'\n'
            fi
          done
          {
            echo "artifacts<<__EOF__"
            printf '%s' "$ART"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build fpk (online)
        if: contains(steps.presets.outputs.do, 'A')
        run: |
          set -e
          bash packaging/fnOS/scripts/build.sh
          # 取 build.sh 的原始输出（无档位后缀），排除任何已归档产物
          FPK=""
          for f in packaging/fnOS/dist/hermes-*.fpk; do
            case "$f" in
              *-online.fpk|*-presetB.fpk) ;;
              *) FPK="$f" ;;
            esac
          done
          [ -n "$FPK" ] || { echo "✗ 未找到在线版原始产物"; ls -la packaging/fnOS/dist/; exit 1; }
          mv "$FPK" "${FPK%.fpk}-online.fpk"

      - name: Build fpk (preset B)
        if: contains(steps.presets.outputs.do, 'B')
        run: |
          set -e
          # ⚠ 不能 `rm -f dist/hermes-*.fpk`：A+B 全量构建时那会把上一步刚
          #   改名好的 -online.fpk 一起删掉（Release 只剩 B）。
          #   只清【未带档位后缀】的中间产物（build.sh 的原始输出名）。
          for f in packaging/fnOS/dist/hermes-*.fpk; do
            case "$f" in
              *-online.fpk|*-presetB.fpk) ;;   # 已归档，保留
              *) rm -f "$f" ;;                 # 中间产物，清掉
            esac
          done
          bash packaging/fnOS/scripts/build.sh --preset B
          # 取 build.sh 的原始输出（无档位后缀）：此时 dist 里还留着已归档的
          # A 版，不能简单 `ls -t | head -1`（A 可能比 B 新 → 取错）。
          FPK=""
          for f in packaging/fnOS/dist/hermes-*.fpk; do
            case "$f" in
              *-online.fpk|*-presetB.fpk) ;;
              *) FPK="$f" ;;
            esac
          done
          [ -n "$FPK" ] || { echo "✗ 未找到 B 版原始产物"; ls -la packaging/fnOS/dist/; exit 1; }
          mv "$FPK" "${FPK%.fpk}-presetB.fpk"

      - name: Verify fpk
        run: |
          set -e
          # 按本次构建的档位逐个校验：单独跑 B 时不应要求 A 存在（反之亦然）。
          PRESETS="${{ steps.presets.outputs.do }}"
          [ -n "$PRESETS" ] || { echo "✗ 未解析出构建档位"; exit 1; }
          for P in $PRESETS; do
            case "$P" in
              A) FPK="$(ls packaging/fnOS/dist/hermes-*online.fpk 2>/dev/null | head -1)" ;;
              B) FPK="$(ls packaging/fnOS/dist/hermes-*presetB.fpk 2>/dev/null | head -1)" ;;
            esac
            [ -n "$FPK" ] && [ -f "$FPK" ] || { echo "✗ 档位 $P 缺少产物"; exit 1; }
            echo "=== 校验档位 $P: $FPK ($(du -h "$FPK" | cut -f1)) ==="
            bash packaging/fnOS/scripts/verify-fpk.sh "$FPK" "$P" \
              || { echo "✗ 档位 $P 校验失败"; exit 1; }
          done


      # ⚠ 单独跑 B 时 dist 里只有 presetB 产物，若把两个 glob 都写死，
      #   upload-artifact 会因 online 那个匹配不到而整体报错（if-no-files-found:
      #   error 是按整个 path 列表判定的）。故用 presets 步骤算好的路径列表。
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ steps.ver.outputs.version }}-fpk
          path: ${{ steps.presets.outputs.artifacts }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [fpk]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fpk artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-${{ needs.fpk.outputs.version }}-fpk
          path: dist

      - name: Locate .fpk (unpack if needed)
        run: |
          set -euo pipefail
          find dist -type f -name '*.zip' | while read -r z; do unzip -o "$z" -d "$(dirname "$z")"; done
          FPK="$(find dist -type f -name 'hermes-*.fpk' | head -n 1)"
          [ -n "$FPK" ] || { echo "✗ 未找到 hermes-*.fpk"; find dist -maxdepth 4; exit 1; }
          mkdir -p release
          cp -f "$FPK" "release/$(basename "$FPK")"
          echo "fpk_path=release/$(basename "$FPK")" >> "$GITHUB_ENV"

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.fpk.outputs.version }}
          UPSTREAM_REF: ${{ needs.fpk.outputs.ref }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi

          # ⚠ dispatch 触发时，TAG=v<version> 通常【已存在】且可能指向旧提交 ——
          # 那样 release 会「新 fpk 贴在旧页面上」：资产是最新的，但 Source code
          # 与创建时间停在旧 commit（真机反馈）。非 tag 触发时把 TAG 重指到当前
          # HEAD，保证 release 与它对应的代码一致。tag 触发时不需动（它本身就是那个 tag）。
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            CUR="$(git rev-parse "refs/tags/${TAG}" 2>/dev/null || true)"
            if [ "${CUR}" != "${GITHUB_SHA}" ]; then
              echo "重指 tag ${TAG}: ${CUR:-<不存在>} → ${GITHUB_SHA}"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git config user.name  "github-actions[bot]"
              git tag -f "${TAG}" "${GITHUB_SHA}"
              git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "refs/tags/${TAG}"
            else
              echo "tag ${TAG} 已指向当前 HEAD，无需重指"
            fi
          fi

          FPK="${fpk_path:?}"; BASENAME="$(basename "$FPK")"
          SUM="$(sha256sum "$FPK" | awk '{print $1}')"
          NOTES="$(mktemp)"
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${TAG}" | head -n 1 || true)"
          if [ -n "${PREV_TAG}" ]; then
            # 只取 commit 标题第一行、去掉常规前缀（修 xxx：/CI：等），限量 8 条
            CHANGES="$(git log --no-merges --pretty=format:'%s' "${PREV_TAG}..HEAD"               | sed -E 's/^[^：:]{1,12}[：:] //' | head -n 8               | sed 's/^/- /')"
            CHANGE_HEADER="自 \`${PREV_TAG}\` 以来（共 $(git rev-list --count "${PREV_TAG}..HEAD") 个提交，节选）："
          else
            CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' -n 5)"
            CHANGE_HEADER="最近提交："
          fi
          [ -n "${CHANGES}" ] || CHANGES="- （无 commit 说明）"
          cat > "$NOTES" <<EOF
          ## Hermes Agent ${VERSION} · 飞牛 fnOS 原生版

          - 上游 ref: \`${UPSTREAM_REF}\`
          - 运行环境: 安装期由上游 PM 创建真实 venv（Python 版本跟随上游 pm/lock.json）
          - 构建: Actions run ${GITHUB_RUN_ID}
          - \`${BASENAME}\` sha256: \`${SUM}\`

          ### 安装
          应用中心 → 手动安装 → 选择 \`${BASENAME}\`。**首次安装需联网**下载源码与依赖
          （约 900 MB；网络受限请在向导里填代理），耗时 1–5 分钟。

          ### 在线更新
          安装后可用上游原生 \`hermes update\` 跟随上游新版本（源码带 .git），
          dashboard「系统」页或 SSH 均可。

          ### 变更
          ${CHANGE_HEADER}

          ${CHANGES}
          EOF
          # 上传本次实际构建的全部档位（单独跑 B 时不该去传不存在的 A，反之亦然）
          ASSETS=("$FPK")
          BFPK="$(find dist -type f -name 'hermes-*presetB.fpk' | head -n 1 || true)"
          if [ -n "$BFPK" ] && [ "$BFPK" != "$FPK" ]; then
            cp -f "$BFPK" "release/$(basename "$BFPK")"
            ASSETS+=("release/$(basename "$BFPK")")
          fi
          echo "上传资产：${ASSETS[*]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Hermes ${VERSION}" --notes-file "$NOTES"
          fi
          echo "✓ Release $TAG 已发布"
