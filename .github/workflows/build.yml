name: build

# 构建：push main / 打 tag v* / 手动都会跑（产出 Artifacts）
# Release：仅 tag v* 或手动勾选 publish_release 时才发
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build.yml"
      - "upstream.version"
      - "fnos.version"
      - "packaging/**"
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Hermes 上游 ref（tag / branch / commit），留空用 upstream.version 里钉住的值"
        required: false
        default: ""
      publish_release:
        description: "验证通过后发布 GitHub Release（勾选才发）"
        type: boolean
        required: false
        default: false

env:
  # 构建机必须 Linux：包里分发的是 Linux CPython 与 Linux .so，Windows/macOS 无法执行它们完成依赖安装。
  NODE_VERSION: "22"

jobs:
  fpk:
    name: Build fnOS fpk
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + upstream ref
        id: ver
        run: |
          set -e
          # 版本优先级必须与 build.sh 完全一致，否则会出现
          # 「资产名 hermes-0.22.2-1.fpk 但 tag=v0.22.2」的错配：
          #   1) fnos.version（同上游版本重打包时递增 -1/-2，如 0.22.2-1）
          #   2) 上游 ref 推导（剥 v 前缀与 +canary，保留 -N）
          if [ -n "${{ github.event.inputs.hermes_ref }}" ]; then
            REF="${{ github.event.inputs.hermes_ref }}"
          else
            REF="$(grep -vE '^\s*#|^\s*$' upstream.version | head -n 1 | tr -d '[:space:]' || true)"
          fi
          UP_VER="$(printf '%s' "$REF" | sed -E 's/^v//; s/\+.*$//')"
          FNOS_VER="$(grep -vE '^\s*#|^\s*$' fnos.version 2>/dev/null | head -n 1 | tr -d '[:space:]' || true)"
          # fnos.version 只允许是「同一上游版本 + -N 修订」：主体必须等于上游版本。
          # 否则说明上游发了新版而 fnos.version 忘了改 → 忽略它并告警，
          # 避免把新版包错标成旧版本号（那会导致应用中心认为需要降级）。
          if [ -n "$FNOS_VER" ]; then
            BASE="${FNOS_VER%%-*}"
            if [ "$BASE" = "$UP_VER" ]; then
              VERSION="$FNOS_VER"
              echo "使用 fnos.version 指定的打包版本: $VERSION"
            else
              echo "::warning::fnos.version=$FNOS_VER 与上游 $UP_VER 不一致，已忽略（请更新或清空 fnos.version）"
              VERSION="$UP_VER"
            fi
          else
            VERSION="$UP_VER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION（跟随上游 $REF）"
          echo "钉住的上游 ref: $REF"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        run: |
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          python3 --version
          node --version
          npm --version
          "$HOME/.local/bin/uv" --version
          echo "--- glibc ---"
          ldd --version | head -1

      # 构建期现在只做：源码树快照 + 前端构建 + 打包。
      # 不再下载 CPython、不再装依赖（那些改为安装期由 PM 完成）。
      # 注意：**不设**国内镜像 —— Actions runner 在海外，直连最快。
      - name: Build fpk
        run: |
          set -e
          bash packaging/fnOS/scripts/build.sh

      - name: Verify fpk
        run: |
          set -e
          FPK="$(ls packaging/fnOS/dist/hermes-*.fpk | head -1)"
          SIZE=$(stat -c%s "$FPK")
          echo "fpk: $FPK ($(du -h "$FPK" | cut -f1))"
          LIST="$(tar -tzf "$FPK")"
          echo "$LIST" | head -12

          # ── 顶层结构 ──────────────────────────────────────
          for need in manifest ICON.PNG ICON_256.PNG app.tgz \
                      cmd/main cmd/install_callback cmd/config_callback cmd/uninstall_callback \
                      config/privilege config/resource \
                      wizard/install wizard/config wizard/uninstall; do
            echo "$LIST" | grep -qx "$need" || { echo "✗ fpk 顶层缺少 $need"; exit 1; }
          done

          X="$(mktemp -d)"
          tar -xzf "$FPK" -C "$X" app.tgz manifest cmd/main cmd/install_callback \
                             wizard/install wizard/config
          A="$(tar -tzf "$X/app.tgz")"

          # ── app.tgz 必须含的安装期组件 ────────────────────
          for need in ./scripts/install-runtime.sh ./gateway-proxy.py ./envfile.sh \
                      ./ui/config ./bin/hermes ./runtime/web_dist/index.html \
                      ./runtime/install-stamp.json ./upstream-ref; do
            echo "$A" | grep -qx "$need" || { echo "✗ app.tgz 缺少 $need"; exit 1; }
          done

          # ── app.tgz 不得包含的东西（本版改为安装期获取）────
          if echo "$A" | grep -qE '^\./runtime/(python|hermes)/'; then
            echo "✗ app.tgz 仍含 runtime/python 或源码树"; exit 1
          fi
          if echo "$A" | grep -qx './runtime/deps.txt'; then
            echo "✗ app.tgz 仍含 deps.txt"; exit 1
          fi
          if echo "$A" | grep -qx './hermes-update.py'; then
            echo "✗ app.tgz 仍含 hermes-update.py（已改用上游 hermes update）"; exit 1
          fi

          # ── 体积回归保护：不再预置运行时，应远小于 50MB ──
          # （前端 web_dist 约 10MB，其余脚本/图标很小）
          if [ "$SIZE" -gt 52428800 ]; then
            echo "✗ fpk 体积 $(du -h "$FPK" | cut -f1) 超过 50MB —— 疑似又把运行时打包进去了"
            exit 1
          fi
          echo "✓ 体积 $(du -h "$FPK" | cut -f1)（未预置运行时）"

          # ── 关键配置断言 ──────────────────────────────────
          grep -q '^service_port[[:space:]]*=[[:space:]]*9119' "$X/manifest" \
            || { echo "✗ manifest 缺少 service_port = 9119"; exit 1; }
          grep -q '^checkport[[:space:]]*=[[:space:]]*true' "$X/manifest" \
            || { echo "✗ manifest 缺少 checkport"; exit 1; }
          for f in wizard/install wizard/config; do
            grep -q 'wizard_auth_password' "$X/$f" \
              || { echo "✗ $f 缺少面板密码字段"; exit 1; }
          done
          grep -q 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD' "$X/cmd/main" \
            || { echo "✗ cmd/main 未注入 basic auth"; exit 1; }
          grep -q 'envfile.sh' "$X/cmd/main" \
            || { echo "✗ cmd/main 未加载 envfile.sh"; exit 1; }
          grep -q 'install-runtime.sh' "$X/cmd/install_callback" \
            || { echo "✗ install_callback 未调用 install-runtime.sh"; exit 1; }

          # ── 关键：补丁必须已删除（防止回退到旧实现）────────
          for fn in ensure_pm_env_ignored lazy_prune_redundant pm_bootstrap_kick \
                    migrate_pm_venv_extras ensure_lazy_site_abi; do
            if grep -q "^${fn}() {" "$X/cmd/main"; then
              echo "✗ cmd/main 仍含旧补丁 ${fn}"; exit 1
            fi
          done
          grep -q 'pm_venv_python()' "$X/cmd/main" \
            || { echo "✗ cmd/main 缺少 pm_venv_python"; exit 1; }
          echo "✓ 补丁已清除，改用 PM 真实 venv"

          # ── web_dist 前缀别名（端口直连白屏修复）──────────
          LINKS="$(tar -tvzf "$X/app.tgz" | grep 'runtime/web_dist/app/hermes' || true)"
          echo "$LINKS" | grep -q '^l' \
            || { echo "✗ web_dist 缺少 app/hermes 软链"; exit 1; }
          echo "✓ web_dist 前缀别名存在"

          rm -rf "$X"
          echo "✓ fpk 结构检查通过"


      - uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ steps.ver.outputs.version }}-fpk
          path: packaging/fnOS/dist/hermes-*.fpk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [fpk]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fpk artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-${{ needs.fpk.outputs.version }}-fpk
          path: dist

      - name: Locate .fpk (unpack if needed)
        run: |
          set -euo pipefail
          find dist -type f -name '*.zip' | while read -r z; do unzip -o "$z" -d "$(dirname "$z")"; done
          FPK="$(find dist -type f -name 'hermes-*.fpk' | head -n 1)"
          [ -n "$FPK" ] || { echo "✗ 未找到 hermes-*.fpk"; find dist -maxdepth 4; exit 1; }
          mkdir -p release
          cp -f "$FPK" "release/$(basename "$FPK")"
          echo "fpk_path=release/$(basename "$FPK")" >> "$GITHUB_ENV"

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.fpk.outputs.version }}
          UPSTREAM_REF: ${{ needs.fpk.outputs.ref }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi

          # ⚠ dispatch 触发时，TAG=v<version> 通常【已存在】且可能指向旧提交 ——
          # 那样 release 会「新 fpk 贴在旧页面上」：资产是最新的，但 Source code
          # 与创建时间停在旧 commit（真机反馈）。非 tag 触发时把 TAG 重指到当前
          # HEAD，保证 release 与它对应的代码一致。tag 触发时不需动（它本身就是那个 tag）。
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            CUR="$(git rev-parse "refs/tags/${TAG}" 2>/dev/null || true)"
            if [ "${CUR}" != "${GITHUB_SHA}" ]; then
              echo "重指 tag ${TAG}: ${CUR:-<不存在>} → ${GITHUB_SHA}"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git config user.name  "github-actions[bot]"
              git tag -f "${TAG}" "${GITHUB_SHA}"
              git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "refs/tags/${TAG}"
            else
              echo "tag ${TAG} 已指向当前 HEAD，无需重指"
            fi
          fi

          FPK="${fpk_path:?}"; BASENAME="$(basename "$FPK")"
          SUM="$(sha256sum "$FPK" | awk '{print $1}')"
          NOTES="$(mktemp)"
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${TAG}" | head -n 1 || true)"
          if [ -n "${PREV_TAG}" ]; then
            CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD")"
            CHANGE_HEADER="自 \`${PREV_TAG}\` 以来："
          else
            CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' -n 10)"
            CHANGE_HEADER="最近提交："
          fi
          [ -n "${CHANGES}" ] || CHANGES="- （无 commit 说明）"
          cat > "$NOTES" <<EOF
          ## Hermes Agent ${VERSION} · 飞牛 fnOS 原生版

          - 上游 ref: \`${UPSTREAM_REF}\`
          - 内置运行时: CPython 3.14（python-build-standalone，自带 SQLite 3.53.1）
          - 构建: Actions run ${GITHUB_RUN_ID}
          - \`${BASENAME}\` sha256: \`${SUM}\`

          ### 安装
          应用中心 → 手动安装 → 选择 \`${BASENAME}\`。桌面图标走飞牛统一网关，无需令牌。

          ### 在线更新
          安装后可在 dashboard 内（\`/app/hermes/__hermes/update/ui\`）或 SSH 里
          \`hermes-update check|apply\` 更新到上游新版本。

          ### 变更
          ${CHANGE_HEADER}

          ${CHANGES}
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FPK" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$FPK" --title "Hermes ${VERSION}" --notes-file "$NOTES"
          fi
          echo "✓ Release $TAG 已发布"
