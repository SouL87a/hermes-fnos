name: build

# 构建：push main / 打 tag v* / 手动都会跑（产出 Artifacts）
# Release：仅 tag v* 或手动勾选 publish_release 时才发
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build.yml"
      - "upstream.version"
      - "fnos.version"
      - "packaging/**"
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Hermes 上游 ref（tag / branch / commit），留空用 upstream.version 里钉住的值"
        required: false
        default: ""
      publish_release:
        description: "验证通过后发布 GitHub Release（勾选才发）"
        type: boolean
        required: false
        default: false

env:
  # 构建机必须 Linux：包里分发的是 Linux CPython 与 Linux .so，Windows/macOS 无法执行它们完成依赖安装。
  NODE_VERSION: "22"

jobs:
  fpk:
    name: Build fnOS fpk
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + upstream ref
        id: ver
        run: |
          set -e
          # 版本跟随上游：fpk 版本 = 上游 ref 的版本号
          # （v0.21.4+canary.… → 0.21.4），与应用中心/install-stamp 一致。
          if [ -n "${{ github.event.inputs.hermes_ref }}" ]; then
            REF="${{ github.event.inputs.hermes_ref }}"
          else
            REF="$(grep -vE '^\s*#|^\s*$' upstream.version | head -n 1 | tr -d '[:space:]')"
          fi
          VERSION="$(printf '%s' "$REF" | sed -E 's/^v//; s/[+-].*$//')"
          [ -n "$VERSION" ] || VERSION="$(grep -vE '^\s*#|^\s*$' fnos.version | head -n 1 | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION（跟随上游 $REF）"
          echo "钉住的上游 ref: $REF"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        run: |
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          python3 --version
          node --version
          npm --version
          "$HOME/.local/bin/uv" --version
          echo "--- glibc ---"
          ldd --version | head -1

      - name: Build fpk
        env:
          # 注意：**不设**国内镜像 —— Actions runner 在海外，PyPI/GitHub 直连最快；
          # 清华/淘宝源反而拖慢甚至超时。（本地/国内构建时才设
          # HERMES_PIP_INDEX / HERMES_NPM_REGISTRY。）
          #
          # 构建机 ubuntu-24.04（glibc 2.39）→ 目标 fnOS Debian 12（glibc 2.36）。
          # build.sh 默认强制 --only-binary=:all:，只取 manylinux 预编译 wheel，
          # 避免本地编译出链接到新 glibc 符号的 .so（装到 NAS 上会 GLIBC not found）。
          HERMES_ALLOW_SOURCE_BUILD: "0"
        run: |
          set -e
          bash packaging/fnOS/scripts/build.sh

      - name: Verify fpk
        run: |
          set -e
          FPK="$(ls packaging/fnOS/dist/hermes-*.fpk | head -1)"
          echo "fpk: $FPK ($(du -h "$FPK" | cut -f1))"
          LIST="$(tar -tzf "$FPK")"
          echo "$LIST" | head -12

          # fpk 顶层：注意 ui/ 在 app.tgz 内，不在顶层
          for need in manifest ICON.PNG ICON_256.PNG app.tgz cmd/main cmd/install_callback cmd/config_callback config/privilege config/resource wizard/install wizard/config; do
            echo "$LIST" | grep -qx "$need" || { echo "✗ fpk 顶层缺少 $need"; exit 1; }
          done

          # app.tgz 内关键部件（ui/ 与 gateway-proxy/hermes-update 都在这里）
          tar -xzf "$FPK" app.tgz
          A="$(tar -tzf app.tgz)"
          for need in ./ui/config ./ui/images/icon_64.png ./gateway-proxy.py ./hermes-update.py \
                      ./bin/hermes-update ./runtime/deps.txt \
                      ./runtime/web_dist/index.html ./runtime/web-build.mjs \
                      ./runtime/hermes/hermes_cli/__init__.py; do
            echo "$A" | grep -qx "$need" || { echo "✗ app.tgz 缺少 $need"; exit 1; }
          done

          # Python 运行时：两种模式二选一
          #   自带模式（默认）→ runtime/python/bin/python3
          #   系统模式        → runtime/.use-system-python 标记，安装时在 NAS 建 venv
          if echo "$A" | grep -qx "./runtime/.use-system-python"; then
            echo "✓ 系统 Python 模式（安装时在 NAS 建 venv）"
          elif echo "$A" | grep -qx "./runtime/python/bin/python3"; then
            echo "✓ 自带 CPython 模式"
          else
            echo "✗ 既无 .use-system-python 标记，也无 runtime/python/bin/python3"; exit 1
          fi

          # 自带模式：实跑包内解释器，断言 SQLite 版本过 Hermes 的 WAL-reset 门。
          # 这是本次默认切自带模式的【核心目的】—— 若 PBS tag 变更导致 SQLite 掉回
          # 窗口外（如 3.51.1），此处立即失败，而不是等装到 NAS 上才发现 WAL 被降级。
          # ⚠ 用单行 -c：YAML 块标量里没法把多行 Python 顶格写，缩进的顶层语句会
          #   触发 IndentationError: unexpected indent。
          if echo "$A" | grep -qx "./runtime/python/bin/python3"; then
            tar -xzf app.tgz ./runtime/python
            ./runtime/python/bin/python3 -c "import sqlite3,sys; print('  自带 CPython SQLite:', sqlite3.sqlite_version); i=sqlite3.sqlite_version_info; sys.exit(1 if not (i<(3,7,0) or i>=(3,51,3) or (3,50,7)<=i<(3,51,0) or (3,44,6)<=i<(3,45,0)) else 0)" \
              || { echo '✗ SQLite 命中 WAL-reset 门 —— state.db 会降级 DELETE，doctor 报假 FTS 损坏'; exit 1; }
            echo '✓ SQLite 过 WAL-reset 门（WAL 可用）'
          fi

          # 构建信息戳（commit/发行方）。⚠ 版本号不来自它：上游读源码树的
          # hermes_cli/__init__.py；此文件对自更新无作用，仅留构建来源。
          echo "$A" | grep -qx "./runtime/hermes/install-stamp.json" \
            && echo "✓ 含 install-stamp.json（构建来源信息）" \
            || { echo "✗ 缺少 install-stamp.json"; exit 1; }

          # .git 必须在【工作树外】（runtime/hermes-git.git）：
          # ① 我们的 hermes-update.py 用 GIT_DIR 定向它做 git 更新；
          # ② 工作树无 .git → 上游 `hermes update` 在 Linux 直接 "Not a git
          #    repository. Please reinstall:" 退出，堵住自伤通道。见第三轮审计 P0。
          echo "$A" | grep -q "^\./runtime/hermes-git\.git/" \
            && echo "✓ .git 已移出工作树（在线更新可用，且堵住 hermes update 自伤）" \
            || { echo "✗ 缺少 runtime/hermes-git.git"; exit 1; }
          echo "$A" | grep -qx "./runtime/hermes/.git/HEAD" \
            && { echo "✗ 工作树内仍有 .git —— 会让 hermes update 自伤"; exit 1; } \
            || echo "✓ 工作树内无 .git"

          echo "✓ fpk 结构检查通过"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ steps.ver.outputs.version }}-fpk
          path: packaging/fnOS/dist/hermes-*.fpk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [fpk]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fpk artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-${{ needs.fpk.outputs.version }}-fpk
          path: dist

      - name: Locate .fpk (unpack if needed)
        run: |
          set -euo pipefail
          find dist -type f -name '*.zip' | while read -r z; do unzip -o "$z" -d "$(dirname "$z")"; done
          FPK="$(find dist -type f -name 'hermes-*.fpk' | head -n 1)"
          [ -n "$FPK" ] || { echo "✗ 未找到 hermes-*.fpk"; find dist -maxdepth 4; exit 1; }
          mkdir -p release
          cp -f "$FPK" "release/$(basename "$FPK")"
          echo "fpk_path=release/$(basename "$FPK")" >> "$GITHUB_ENV"

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.fpk.outputs.version }}
          UPSTREAM_REF: ${{ needs.fpk.outputs.ref }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          FPK="${fpk_path:?}"; BASENAME="$(basename "$FPK")"
          SUM="$(sha256sum "$FPK" | awk '{print $1}')"
          NOTES="$(mktemp)"
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${TAG}" | head -n 1 || true)"
          if [ -n "${PREV_TAG}" ]; then
            CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD")"
            CHANGE_HEADER="自 \`${PREV_TAG}\` 以来："
          else
            CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' -n 10)"
            CHANGE_HEADER="最近提交："
          fi
          [ -n "${CHANGES}" ] || CHANGES="- （无 commit 说明）"
          cat > "$NOTES" <<EOF
          ## Hermes Agent ${VERSION} · 飞牛 fnOS 原生版

          - 上游 ref: \`${UPSTREAM_REF}\`
          - 内置运行时: CPython 3.12（python-build-standalone，自带 SQLite 3.53.1）
          - 构建: Actions run ${GITHUB_RUN_ID}
          - \`${BASENAME}\` sha256: \`${SUM}\`

          ### 安装
          应用中心 → 手动安装 → 选择 \`${BASENAME}\`。桌面图标走飞牛统一网关，无需令牌。

          ### 在线更新
          安装后可在 dashboard 内（\`/app/hermes/__hermes/update/ui\`）或 SSH 里
          \`hermes-update check|apply\` 更新到上游新版本。

          ### 变更
          ${CHANGE_HEADER}

          ${CHANGES}
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FPK" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$FPK" --title "Hermes ${VERSION}" --notes-file "$NOTES"
          fi
          echo "✓ Release $TAG 已发布"
